name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_PROJECT_NAME: topology-lantern
  RELEASE_PROJECT_VERSION: "0.5.0"
  RELEASE_SYFT_VERSION: "1.51.1"

jobs:
  verify-ci:
    name: Require main ancestry and successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag commit is reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "release workflow must run from a version tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          commit_verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          commit_reason="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.reason')"
          if [ "$commit_verified" != "true" ]; then
            echo "release commit signature is not verified (reason: $commit_reason)" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release commit is not reachable from origin/main" >&2
            exit 1
          }
      - name: Wait for the complete CI workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            successful="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .event == \"push\" and .head_branch == \"main\" and .head_sha == \"$GITHUB_SHA\")] | length")"
            if [ "$successful" -gt 0 ]; then
              echo "verified successful CI workflow for $GITHUB_SHA"
              exit 0
            fi
            echo "CI has not succeeded yet (attempt $attempt/90)"
            sleep 20
          done
          echo "no successful complete CI workflow found for $GITHUB_SHA" >&2
          exit 1

  build:
    name: Build and verify distributions
    needs: verify-ci
    if: needs.verify-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned uv and frozen development environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --frozen --extra dev
      - name: Run release quality gate
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy --python-version 3.11 src
          uv run --frozen bandit -q -r src
          uv run --frozen pytest --cov=topology_lantern --cov-branch --cov-report=term-missing
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ env.RELEASE_PROJECT_VERSION }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(
                  f"project version {version!r} does not match release workflow "
                  f"version {os.environ['EXPECTED_VERSION']!r}"
              )
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          print(f"validated project version {version}")
          PY
      - name: Fix build timestamp to the source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build from a clean output directory
        run: |
          rm -rf dist build
          uv run --frozen python -m build --no-isolation
      - name: Validate distribution metadata and shape
        run: |
          uv run --frozen python -m twine check --strict dist/*
          uv run --frozen python - <<'PY'
          import tarfile
          import zipfile
          import os
          from pathlib import Path

          from topology_lantern.distribution_audit import audit_sdist, audit_wheel

          wheels = tuple(Path("dist").glob("*.whl"))
          sdists = tuple(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1 or len(tuple(Path("dist").iterdir())) != 2:
              raise SystemExit("expected exactly one wheel and one .tar.gz source distribution")
          with tarfile.open(sdists[0], "r:gz") as archive:
              source_names = audit_sdist(
                  archive,
                  expected_root=f"topology_lantern-{os.environ['RELEASE_PROJECT_VERSION']}",
              )
          required_source = {
              "CITATION.cff",
              "benchmarks/manifest.json",
              "benchmarks/sky130-common-source.json",
              "docs/graph-sequences.md",
              "docs/schemas/analog-sizing-benchmark-1.schema.json",
              "docs/schemas/circuit-graph-1.schema.json",
              "docs/schemas/connectivity-graph-1.schema.json",
              "docs/schemas/euler-sequence-1.schema.json",
              "docs/schemas/layout-constraint-report-1.schema.json",
              "docs/schemas/layout-constraints-1.schema.json",
              "docs/schemas/rule-sequence-checkpoint-1.schema.json",
              "docs/schemas/rule-sequence-evaluation-1.schema.json",
              "docs/schemas/rule-sequence-samples-1.schema.json",
              "examples/circuits/device_families.sp",
              "examples/sky130_common_source.json",
              "src/topology_lantern/dco.py",
              "src/topology_lantern/distribution_audit.py",
              "src/topology_lantern/graph_codec.py",
              "src/topology_lantern/graph_sequence.py",
              "src/topology_lantern/release_artifacts.py",
          }
          if missing := required_source - source_names:
              raise SystemExit(f"source distribution is missing: {sorted(missing)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = audit_wheel(archive)
          required_wheel = {
              "topology_lantern/_version.py",
              "topology_lantern/dco.py",
              "topology_lantern/distribution_audit.py",
              "topology_lantern/graph_codec.py",
              "topology_lantern/graph_sequence.py",
              "topology_lantern/py.typed",
              "topology_lantern/release_artifacts.py",
              "topology_lantern/schemas/analog-sizing-benchmark-1.schema.json",
              "topology_lantern/schemas/circuit-graph-1.schema.json",
              "topology_lantern/schemas/connectivity-graph-1.schema.json",
              "topology_lantern/schemas/euler-sequence-1.schema.json",
              "topology_lantern/schemas/layout-constraint-report-1.schema.json",
              "topology_lantern/schemas/layout-constraints-1.schema.json",
              "topology_lantern/schemas/rule-sequence-checkpoint-1.schema.json",
              "topology_lantern/schemas/rule-sequence-evaluation-1.schema.json",
              "topology_lantern/schemas/rule-sequence-samples-1.schema.json",
          }
          if missing := required_wheel - wheel_names:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          PY
      - name: Install wheel and smoke-check metadata and CLI version
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .release-smoke/bin/python -I - <<'PY'
          import json
          import subprocess
          import tempfile
          from importlib.resources import files
          from importlib.metadata import version
          from pathlib import Path

          import topology_lantern

          expected = version("topology-lantern")
          if topology_lantern.__version__ != expected:
              raise SystemExit("runtime and distribution versions differ")
          cli = str(Path(".release-smoke/bin/topology-lantern").resolve())
          completed = subprocess.run(
              [cli, "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          if completed.stdout.strip() != f"topology-lantern {expected}":
              raise SystemExit("CLI version does not match distribution metadata")
          schema_root = files("topology_lantern").joinpath("schemas")
          for name in (
              "analog-sizing-benchmark-1.schema.json",
              "circuit-graph-1.schema.json",
              "connectivity-graph-1.schema.json",
              "euler-sequence-1.schema.json",
              "layout-constraint-report-1.schema.json",
              "layout-constraints-1.schema.json",
              "rule-sequence-checkpoint-1.schema.json",
              "rule-sequence-evaluation-1.schema.json",
              "rule-sequence-samples-1.schema.json",
          ):
              json.loads(schema_root.joinpath(name).read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory() as directory:
              netlist = Path(directory, "smoke.sp")
              netlist.write_text("r1 a b 1k\n.end\n", encoding="utf-8")
              ingested = subprocess.run(
                  [cli, "ingest-spice", str(netlist)],
                  check=True,
                  capture_output=True,
                  text=True,
                  cwd=directory,
              )
              graph = json.loads(ingested.stdout)
              if graph["schema"] != "org.topology-lantern.circuit-graph":
                  raise SystemExit("isolated installed CLI produced an invalid graph contract")
              if len(graph["scopes"]) != 1 or sum(
                  len(scope["devices"]) for scope in graph["scopes"]
              ) != 1:
                  raise SystemExit("isolated installed CLI produced an unexpected graph shape")
              compact = topology_lantern.compact_graph(topology_lantern.load_spice(netlist))
              sequence = topology_lantern.encode_graph_sequence(compact, seed=7)
              restored = topology_lantern.parse_graph_sequence(
                  topology_lantern.graph_sequence_json(sequence)
              )
              if topology_lantern.decode_graph_sequence(restored) != compact:
                  raise SystemExit("installed graph sequence did not preserve exact connectivity")
              training = Path(directory, "training.json")
              heldout = Path(directory, "heldout.json")
              training.write_text(
                  json.dumps({"name": "training", "supply_voltage": 1.2}),
                  encoding="utf-8",
              )
              heldout.write_text(
                  json.dumps({"name": "heldout", "supply_voltage": 2.4}),
                  encoding="utf-8",
              )
              checkpoint = Path(directory, "checkpoint.json")
              subprocess.run(
                  [
                      cli,
                      "baseline-train",
                      str(training),
                      "--heldout-spec",
                      str(heldout),
                      "--candidate-limit",
                      "1",
                      "--output",
                      str(checkpoint),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  cwd=directory,
              )
              sampled = subprocess.run(
                  [cli, "baseline-sample", str(checkpoint), str(heldout), "--draws", "1"],
                  check=True,
                  capture_output=True,
                  text=True,
                  cwd=directory,
              )
              sample_report = json.loads(sampled.stdout)
              if sample_report["requested_draws"] != 1 or len(sample_report["draws"]) != 1:
                  raise SystemExit("isolated installed baseline CLI violated its draw budget")
              valid_draws = sum(draw["rejection"] is None for draw in sample_report["draws"])
              if sample_report["valid_draws"] != valid_draws:
                  raise SystemExit("isolated installed baseline CLI misreported draw accounting")
          PY
          site_packages="$(.release-smoke/bin/python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          installation_root="$(realpath .release-smoke)"
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          if [ "$installation_root" != "$workspace_root/.release-smoke" ]; then
            echo "release virtual environment resolved outside its expected root" >&2
            exit 1
          fi
          case "$site_packages" in
            "$installation_root"/*) ;;
            *) echo "installed site-packages escaped the release virtual environment" >&2; exit 1 ;;
          esac
          echo "RELEASE_INSTALLATION_ROOT=$installation_root" >> "$GITHUB_ENV"
          echo "RELEASE_SITE_PACKAGES=$site_packages" >> "$GITHUB_ENV"
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_SOURCE_NAME: ${{ env.RELEASE_PROJECT_NAME }}
          SYFT_SOURCE_VERSION: ${{ env.RELEASE_PROJECT_VERSION }}
        with:
          path: .release-smoke
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          syft-version: v${{ env.RELEASE_SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Validate the installed-wheel SBOM and release checksums
        run: |
          uv run --frozen python -m topology_lantern.release_artifacts bind-installed-wheel \
            --sbom dist/SBOM.spdx.json \
            --site-packages "$RELEASE_SITE_PACKAGES" \
            --installation-root "$RELEASE_INSTALLATION_ROOT" \
            --expected-external-path "bin/topology-lantern" \
            --wheel "dist/topology_lantern-$RELEASE_PROJECT_VERSION-py3-none-any.whl" \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION"
          uv run --frozen python -m topology_lantern.release_artifacts validate-sbom \
            --sbom dist/SBOM.spdx.json \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION" \
            --syft-version "$RELEASE_SYFT_VERSION"
          uv run --frozen python -m topology_lantern.release_artifacts write-checksums \
            --directory dist \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION"
          uv run --frozen python -m topology_lantern.release_artifacts verify-release \
            --directory dist \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION" \
            --syft-version "$RELEASE_SYFT_VERSION"
      - name: Upload verified distributions and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/topology_lantern-${{ env.RELEASE_PROJECT_VERSION }}-py3-none-any.whl
            dist/topology_lantern-${{ env.RELEASE_PROJECT_VERSION }}.tar.gz
            dist/SBOM.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Attest build provenance
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Re-verify downloaded release assets
        run: >-
          python -I src/topology_lantern/release_artifacts.py verify-release
          --directory dist
          --name "$RELEASE_PROJECT_NAME"
          --version "$RELEASE_PROJECT_VERSION"
          --syft-version "$RELEASE_SYFT_VERSION"
      - name: Attest verified distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  github-release:
    name: Create GitHub release
    if: >-
      ${{ github.event_name == 'push' && always() && needs.build.result == 'success' &&
      (needs.provenance.result == 'success' || needs.provenance.result == 'skipped') }}
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Re-verify downloaded release assets
        run: >-
          python -I src/topology_lantern/release_artifacts.py verify-release
          --directory dist
          --name "$RELEASE_PROJECT_NAME"
          --version "$RELEASE_PROJECT_VERSION"
          --syft-version "$RELEASE_SYFT_VERSION"
      - name: Create release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "release tag moved: expected $GITHUB_SHA, resolved $tag_sha" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; refusing to replace its assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/topology_lantern-$RELEASE_PROJECT_VERSION-py3-none-any.whl" \
            "dist/topology_lantern-$RELEASE_PROJECT_VERSION.tar.gz" \
            dist/SBOM.spdx.json \
            dist/SHA256SUMS \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
